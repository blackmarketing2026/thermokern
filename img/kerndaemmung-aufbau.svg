<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Kerndämmung im Wandquerschnitt</title>
  <desc id="desc">Zwischen innerer Mauer und äußerer Verblendschale befindet sich der Hohlraum. Dieser wird bei geeigneter Konstruktion mit Dämmstoff gefüllt.</desc>
  <defs>
    <pattern id="brick" width="100" height="48" patternUnits="userSpaceOnUse"><rect width="100" height="48" fill="#d78d5b"/><path d="M0 0H100M0 24H100M50 0V24M0 24V48M100 24V48" fill="none" stroke="#f9eadc" stroke-width="3"/></pattern>
    <pattern id="insulation" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#dcebc9"/><circle cx="7" cy="7" r="3" fill="#6aa832"/><circle cx="19" cy="19" r="3" fill="#97bf70"/></pattern>
  </defs>
  <rect width="720" height="460" rx="24" fill="#f3f7ee"/>
  <g font-family="system-ui, sans-serif" fill="#2d3436" font-size="24" font-weight="650" text-anchor="middle">
    <text x="175" y="62">Innen</text><text x="548" y="62">Außen</text>
    <rect x="95" y="92" width="190" height="230" rx="6" fill="#a9b1b5"/>
    <path d="M95 150H285M95 208H285M95 266H285M190 92V150M190 208V266" fill="none" stroke="#d8dde0" stroke-width="4"/>
    <rect x="301" y="92" width="116" height="230" fill="url(#insulation)"/>
    <rect x="433" y="92" width="190" height="230" rx="6" fill="url(#brick)"/>
    <path d="M620 205H470" stroke="#2d3436" stroke-width="17" fill="none"/>
    <path d="M464 205H386" stroke="#4a7a20" stroke-width="6" fill="none"/>
    <path d="M388 192L372 205L388 218" stroke="#4a7a20" stroke-width="6" fill="none"/>
    <g font-size="21"><text x="190" y="365">Innere Mauer</text><text x="359" y="365">Dämmstoff</text><text x="538" y="365">Außenschale</text></g>
    <text x="360" y="418" font-size="18" font-weight="400">Schematisch · nicht maßstabsgetreu</text>
  </g>
</svg>
